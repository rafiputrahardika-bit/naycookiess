<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lacak Pesanan - NayCookies</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff8f1;
      color: #40291f;
    }
    header {
      background: #75452f;
      color: white;
      padding: 20px;
      text-align: center;
    }
    header h1 { margin: 0 0 8px; }
    nav { margin-top: 14px; }
    nav a {
      color: white;
      margin: 0 10px;
      text-decoration: none;
      font-size: 14px;
    }
    main {
      width: min(650px, 92%);
      margin: 32px auto;
    }
    .panel {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 5px 22px #56351b12;
      margin-bottom: 20px;
    }
    h2 { margin-top: 0; }
    .muted { color: #796b62; line-height: 1.6; }
    label {
      display: block;
      font-weight: bold;
      margin: 18px 0 8px;
    }
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddc9b9;
      border-radius: 9px;
      font-size: 16px;
    }
    button {
      width: 100%;
      margin-top: 14px;
      padding: 14px;
      background: #75452f;
      color: white;
      border: 0;
      border-radius: 9px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    .order {
      border: 1px solid #eadfd5;
      border-radius: 12px;
      padding: 16px;
      margin-top: 14px;
    }
    .order h3 { margin: 0 0 12px; }
    .status {
      display: inline-block;
      background: #f7eadc;
      color: #75452f;
      border-radius: 20px;
      padding: 7px 11px;
      font-weight: bold;
      font-size: 13px;
      margin: 4px 0 12px;
    }
    .detail {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      padding: 8px 0;
      border-bottom: 1px solid #f2ebe5;
    }
    .detail span:last-child {
      text-align: right;
      overflow-wrap: anywhere;
    }
    .message {
      margin-top: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }
    footer {
      text-align: center;
      color: #796b62;
      font-size: 13px;
      padding: 20px;
    }
  </style>
</head>
<body>
  <header>
    <h1>🍪 NayCookies</h1>
    <div>Manisnya bikin bahagia</div>
    <nav>
      <a href="./index.html">Beranda</a>
      <a href="./index.html#produk">Produk</a>
      <a href="./lacak.html">Lacak Pesanan</a>
    </nav>
  </header>

  <main>
    <section class="panel">
      <h2>Lacak Pesanan 📦</h2>
      <p class="muted">
        Masukkan nomor WhatsApp yang kamu gunakan saat memesan.
        Semua pesanan dengan nomor tersebut akan ditampilkan di sini.
      </p>

      <form id="trackForm">
        <label for="phone">Nomor WhatsApp</label>
        <input
          id="phone"
          type="tel"
          inputmode="tel"
          autocomplete="tel"
          placeholder="Contoh: 081234567890"
          required
          minlength="9"
          maxlength="20"
        >
        <button id="searchBtn" type="submit">Cari Pesanan</button>
      </form>

      <p id="message" class="message" role="status" aria-live="polite"></p>
    </section>

    <section id="results" class="panel" hidden>
      <h2>Hasil Pencarian</h2>
      <div id="orderList"></div>
    </section>
  </main>

  <footer>© NayCookies — Terima kasih sudah memesan 🍪</footer>

  <script type="module">
    import { createClient } from
      "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL = "https://ohcohmrhnjjwhhmbggdp.supabase.co";
    const SUPABASE_KEY = "sb_publishable_F3qfvwEwH2lmkYCnRBI-Og_8csxHdEt";

    const db = createClient(SUPABASE_URL, SUPABASE_KEY);

    const form = document.getElementById("trackForm");
    const phoneInput = document.getElementById("phone");
    const searchBtn = document.getElementById("searchBtn");
    const message = document.getElementById("message");
    const results = document.getElementById("results");
    const orderList = document.getElementById("orderList");

    const statusNames = {
      new: "Pesanan masuk",
      confirmed: "Pesanan dikonfirmasi",
      processing: "Cookies sedang dibuat",
      ready: "Siap diambil / dikirim",
      completed: "Pesanan selesai",
      cancelled: "Pesanan dibatalkan"
    };

    const paymentNames = {
      pending: "Menunggu pembayaran",
      paid: "Sudah dibayar",
      failed: "Pembayaran gagal"
    };

    function rupiah(value) {
      return new Intl.NumberFormat("id-ID", {
        style: "currency",
        currency: "IDR",
        maximumFractionDigits: 0
      }).format(value);
    }

    function addDetail(parent, label, value) {
      const row = document.createElement("div");
      row.className = "detail";

      const left = document.createElement("span");
      left.textContent = label;

      const right = document.createElement("span");
      right.textContent = value;

      row.append(left, right);
      parent.appendChild(row);
    }

    function showOrder(order) {
      const card = document.createElement("article");
      card.className = "order";

      const title = document.createElement("h3");
      title.textContent = "Pesanan " + order.order_code;
      card.appendChild(title);

      const status = document.createElement("div");
      status.className = "status";
      status.textContent =
        statusNames[order.order_status] || order.order_status;
      card.appendChild(status);

      addDetail(card, "Kode pesanan", order.order_code);
      addDetail(
        card,
        "Tanggal",
        new Date(order.created_at).toLocaleString("id-ID", {
          dateStyle: "medium",
          timeStyle: "short"
        })
      );
      addDetail(
        card,
        "Metode pesanan",
        order.fulfillment_method === "delivery"
          ? "Diantar"
          : "Ambil sendiri"
      );
      addDetail(card, "Total", rupiah(order.total_amount));
      addDetail(
        card,
        "Pembayaran",
        paymentNames[order.payment_status] || order.payment_status
      );

      orderList.appendChild(card);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const phone = phoneInput.value.trim();
      const digits = phone.replace(/[^0-9]/g, "");

      if (digits.length < 9 || digits.length > 15) {
        message.textContent = "Periksa kembali nomor WhatsApp kamu.";
        return;
      }

      searchBtn.disabled = true;
      searchBtn.textContent = "Sedang mencari...";
      message.textContent = "";
      orderList.replaceChildren();
      results.hidden = true;

      try {
        const { data, error } = await db.rpc(
          "track_orders_by_phone",
          { p_phone: phone }
        );

        if (error) throw error;

        results.hidden = false;

        if (!data || data.length === 0) {
          message.textContent =
            "Belum ada pesanan yang ditemukan untuk nomor tersebut. Periksa kembali nomor WhatsApp yang digunakan saat memesan.";
          return;
        }

        message.textContent =
          "Ditemukan " + data.length +
          " pesanan terbaru. Maksimal 20 pesanan ditampilkan.";

        data.forEach(showOrder);
      } catch (error) {
        console.error(error);
        message.textContent =
          "Gagal mencari pesanan. Pastikan fungsi lacak sudah dibuat di Supabase, lalu coba lagi.";
      } finally {
        searchBtn.disabled = false;
        searchBtn.textContent = "Cari Pesanan";
      }
    });
  </script>
</body>
</html>
